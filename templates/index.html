<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .tab.active { background: #2563eb; color: white; border-color: #2563eb; }
        .tab:hover:not(.active) { border-color: #60a5fa; color: #e2e8f0; }
        .panel { display: none; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
        .panel.active { display: block; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        textarea, input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; margin-bottom: 16px; resize: vertical; }
        textarea { min-height: 120px; }
        textarea:focus, input:focus, select:focus { outline: none; border-color: #2563eb; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; min-height: 60px; }
        .result.loading { color: #60a5fa; }
        .row { display: flex; gap: 12px; }
        .row > * { flex: 1; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #1e3a5f; color: #60a5fa; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Assistant Hub</h1>
        <p class="subtitle">Powered by AWS Bedrock â€” 4 AI tools in one place</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('summarize')">Summarizer</div>
            <div class="tab" onclick="switchTab('code')">Code Explainer</div>
            <div class="tab" onclick="switchTab('email')">Email Writer</div>
            <div class="tab" onclick="switchTab('chat')">Chat</div>
        </div>

        <!-- Summarizer -->
        <div class="panel active" id="panel-summarize">
            <span class="badge">Text Summarization</span>
            <label>Paste your text</label>
            <textarea id="sum-input" placeholder="Paste a long article, document, or any text you want summarized..."></textarea>
            <button onclick="summarize()">Summarize</button>
            <div class="result" id="sum-result"></div>
        </div>

        <!-- Code Explainer -->
        <div class="panel" id="panel-code">
            <span class="badge">Code Explanation</span>
            <div class="row">
                <div>
                    <label>Language</label>
                    <select id="code-lang">
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="">Other</option>
                    </select>
                </div>
            </div>
            <label>Paste your code</label>
            <textarea id="code-input" placeholder="Paste code here..."></textarea>
            <button onclick="explainCode()">Explain</button>
            <div class="result" id="code-result"></div>
        </div>

        <!-- Email Writer -->
        <div class="panel" id="panel-email">
            <span class="badge">Email Generation</span>
            <label>Topic / Purpose</label>
            <input type="text" id="email-topic" placeholder="e.g., Request for project deadline extension">
            <div class="row">
                <div>
                    <label>Tone</label>
                    <select id="email-tone">
                        <option value="professional">Professional</option>
                        <option value="friendly">Friendly</option>
                        <option value="formal">Formal</option>
                        <option value="casual">Casual</option>
                    </select>
                </div>
                <div>
                    <label>Recipient</label>
                    <input type="text" id="email-recipient" placeholder="e.g., manager, client, team" value="manager">
                </div>
            </div>
            <button onclick="writeEmail()">Generate Email</button>
            <div class="result" id="email-result"></div>
        </div>

        <!-- Chat -->
        <div class="panel" id="panel-chat">
            <span class="badge">AI Chat</span>
            <label>Ask anything</label>
            <textarea id="chat-input" placeholder="Ask me anything..." style="min-height: 80px;"></textarea>
            <button onclick="chat()">Send</button>
            <div class="result" id="chat-result"></div>
        </div>
    </div>

    <script>
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('panel-' + name).classList.add('active');
        }

        async function callAPI(endpoint, body) {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return await res.json();
        }

        async function summarize() {
            const el = document.getElementById('sum-result');
            el.className = 'result loading'; el.textContent = 'Summarizing...';
            const data = await callAPI('/api/summarize', { text: document.getElementById('sum-input').value });
            el.className = 'result'; el.textContent = data.result || data.error;
        }

        async function explainCode() {
            const el = document.getElementById('code-result');
            el.className = 'result loading'; el.textContent = 'Analyzing code...';
            const data = await callAPI('/api/explain-code', {
                code: document.getElementById('code-input').value,
                language: document.getElementById('code-lang').value
            });
            el.className = 'result'; el.textContent = data.result || data.error;
        }

        async function writeEmail() {
            const el = document.getElementById('email-result');
            el.className = 'result loading'; el.textContent = 'Writing email...';
            const data = await callAPI('/api/write-email', {
                topic: document.getElementById('email-topic').value,
                tone: document.getElementById('email-tone').value,
                recipient: document.getElementById('email-recipient').value
            });
            el.className = 'result'; el.textContent = data.result || data.error;
        }

        async function chat() {
            const el = document.getElementById('chat-result');
            el.className = 'result loading'; el.textContent = 'Thinking...';
            const data = await callAPI('/api/chat', { message: document.getElementById('chat-input').value });
            el.className = 'result'; el.textContent = data.result || data.error;
        }
    </script>
</body>
</html>
